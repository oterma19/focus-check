<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)" />
  <title>Focus Check</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%235f8f7b'/%3E%3Cpath d='M19 33l9 9 17-19' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <!-- Иконка и название для телефона (главный экран) -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Focus Check" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Навигация: на компьютере — колонка слева, на телефоне — панель внизу -->
    <nav class="nav" aria-label="Разделы">
      <div class="brand">
        <span class="brand__logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
        </span>
        <span class="brand__name">Focus Check</span>
      </div>

      <a href="#today" class="nav__item" data-nav="today">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>Сегодня</span>
      </a>
      <a href="#focus" class="nav__item" data-nav="focus">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
        <span>Фокус</span>
      </a>
      <a href="#routine" class="nav__item" data-nav="routine">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h11M4 12h9M4 17h7"/><path d="m16 16 2 2 4-4"/></svg>
        <span>Рутина</span>
      </a>
      <a href="#progress" class="nav__item" data-nav="progress">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-4-3-8-6.5-8-11a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 4.5-4 8-8 11Z"/></svg>
        <span>Прогресс</span>
      </a>
      <a href="#settings" class="nav__item nav__item--settings" data-nav="settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        <span>Настройки</span>
      </a>
      <p class="nav__note">Данные хранятся в этом браузере</p>
    </nav>

    <main class="main">
      <div id="view" class="view"></div>
    </main>
  </div>

  <!-- Плашка «идёт фокус» на других экранах -->
  <button id="focusPill" class="focus-pill" hidden aria-label="Открыть фокус"></button>

  <!-- Сюда рисуются всплывающие окна и сообщения -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toasts" aria-live="polite"></div>

  <!--
    БУДУЩЕЕ ПОДКЛЮЧЕНИЕ SUPABASE:
    раскомментируйте строку ниже (библиотека загрузится из интернета),
    затем заполните js/config.js. Порядок важен: библиотека — до наших файлов.
  -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> -->

  <!-- Наши файлы. Порядок важен: сначала основа, потом экраны, app.js — последним. -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/content.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/models.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/screens/today.js"></script>
  <script src="js/screens/elephant.js"></script>
  <script src="js/screens/focus.js"></script>
  <script src="js/screens/routine.js"></script>
  <script src="js/screens/progress.js"></script>
  <script src="js/screens/settings.js"></script>
  <script src="js/flows/rescue.js"></script>
  <script src="js/flows/onboarding.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
